name: Publish

# Optional: git checkout via opentide explorer build is the current distribution
# method for OpenTideHQ repos. This workflow runs only when a GitHub Release is
# published and requires NPM_TOKEN — skip releases until npm publish is desired.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc399786aeafd71eb3f638eae392 # v4.0.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5289caeca8642d1e84afbd3f7d02ff3f8 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Publish
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
