name: Release

# A version tag (vX.Y.Z) publishes @opentide/explorer to npm and opens the GitHub
# Release with that version's CHANGELOG.md notes. Cut one with:
#   npm version X.Y.Z --no-git-tag-version, a CHANGELOG.md section, commit, tag, push.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag, package.json, and changelog agree
        run: node scripts/release.mjs check "${GITHUB_REF_NAME}"

      # `pnpm check` regenerates the schema artifacts from specifications, as in ci.yml.
      - name: Checkout specifications
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentidehq/specifications
          path: specifications
          ref: main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm codegen:specs && pnpm check
        env:
          OPENTIDE_USE_FIXTURE: "1"
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

      # The tarball, installed with npm into an empty project, builds a corpus.
      - name: Package works when installed
        run: node scripts/check-package.mjs

      # npm 11.5+ publishes with trusted publishing (OIDC) once it is configured
      # for the package on npmjs.com; until then NPM_TOKEN authenticates.
      # `check` above replaces prepublishOnly, which builds against the library.
      - name: Publish
        run: |
          npm install --global npm@11
          npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "${GITHUB_REF_NAME}" > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "@opentide/explorer ${GITHUB_REF_NAME}" \
            --notes-file notes.md
