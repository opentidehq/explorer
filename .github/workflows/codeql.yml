name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.28.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: pnpm/action-setup@fe02b34f77f8bc399786aeafd71eb3f638eae392 # v4.0.0
        if: matrix.language == 'javascript-typescript'
        with:
          version: 9

      - uses: actions/setup-node@49933ea5289caeca8642d1e84afbd3f7d02ff3f8 # v4.4.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install and build
        if: matrix.language == 'javascript-typescript'
        run: |
          pnpm install --frozen-lockfile
          node scripts/generate-mock-bundle.mjs
          pnpm build

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3.28.6
        with:
          category: /language:${{ matrix.language }}
