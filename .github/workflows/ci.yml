name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-codegen:
    name: Schema codegen (specifications TOML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_GITHUB_APP: ${{ secrets.GH_APP_ID && secrets.GH_APP_KEY && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: generate_token
        if: ${{ env.HAS_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: OpenTideHQ
          repositories: specifications,library

      - name: Checkout specifications
        uses: actions/checkout@v7
        with:
          repository: OpenTideHQ/specifications
          path: specifications
          ref: main
          token: ${{ steps.generate_token.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate schema artifacts
        run: pnpm codegen:specs
        env:
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

      - name: Verify generated outputs are committed
        run: pnpm codegen:check
        env:
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

  check:
    name: Validate (typecheck, lint, test, build)
    needs: schema-codegen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_GITHUB_APP: ${{ secrets.GH_APP_ID && secrets.GH_APP_KEY && 'true' || 'false' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          df -h

      - uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: generate_token
        if: ${{ env.HAS_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: OpenTideHQ
          repositories: specifications,library

      - name: Checkout specifications
        uses: actions/checkout@v7
        with:
          repository: OpenTideHQ/specifications
          path: specifications
          ref: main
          token: ${{ steps.generate_token.outputs.token }}

      - name: Checkout library
        uses: actions/checkout@v7
        with:
          repository: OpenTideHQ/library
          path: library
          ref: main
          token: ${{ steps.generate_token.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck, lint, format, test, codegen)
        run: pnpm codegen:specs && pnpm check
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}/library
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

      - name: Build static export (fixture corpus)
        # Full library SSG writes ~11GB (.next + out) and overflows ubuntu-latest
        # during export finalize. Fixture keeps CI green; library Pages build
        # covers the real corpus.
        run: |
          rm -rf .next out
          node scripts/generate-mock-bundle.mjs
          pnpm exec next build
        env:
          OPENTIDE_USE_FIXTURE: "1"
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

      - name: Audit
        run: pnpm audit --audit-level=high
