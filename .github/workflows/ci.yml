name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-codegen:
    name: Schema codegen (specifications TOML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_GITHUB_APP: ${{ secrets.GH_APP_ID && secrets.GH_APP_KEY && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: generate_token
        if: ${{ env.HAS_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: opentidehq
          repositories: specifications,library

      - name: Checkout specifications
        uses: actions/checkout@v7
        with:
          repository: opentidehq/specifications
          path: specifications
          ref: main
          # Empty App token overrides checkout's default and fails the step.
          # Fall back to GITHUB_TOKEN so public clones work without App secrets.
          token: ${{ steps.generate_token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate schema artifacts
        run: pnpm codegen:specs
        env:
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

      - name: Verify generated outputs are committed
        run: pnpm codegen:check
        env:
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

  check:
    name: Validate (typecheck, lint, test, build)
    needs: schema-codegen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_GITHUB_APP: ${{ secrets.GH_APP_ID && secrets.GH_APP_KEY && 'true' || 'false' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/lib/node_modules || true
          sudo docker system prune -af || true
          df -h

      - uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: generate_token
        if: ${{ env.HAS_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: opentidehq
          repositories: specifications,library

      - name: Checkout specifications
        uses: actions/checkout@v7
        with:
          repository: opentidehq/specifications
          path: specifications
          ref: main
          # Empty App token overrides checkout's default and fails the step.
          # Fall back to GITHUB_TOKEN so public clones work without App secrets.
          token: ${{ steps.generate_token.outputs.token || github.token }}

      - name: Checkout library
        uses: actions/checkout@v7
        with:
          repository: opentidehq/library
          path: library
          ref: main
          token: ${{ steps.generate_token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests must pass without the library; the corpus step below regenerates public/data.
      - name: Test against the fixture corpus
        run: pnpm test
        env:
          OPENTIDE_USE_FIXTURE: "1"
          OPENTIDE_SKIP_CODEGEN: "1"

      - name: Check (typecheck, lint, format, test, codegen)
        run: pnpm codegen:specs && pnpm check
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}/library
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

      - name: Build static export
        run: |
          rm -rf .next out
          df -h
          pnpm build
          df -h
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}/library
          SPECIFICATIONS_REPO_ROOT: ${{ github.workspace }}/specifications

      - name: Audit
        run: pnpm audit --audit-level=high

  package:
    name: npm package (install and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      # Packs the tarball, installs it with npm into an empty project, and builds the
      # fixture corpus with the installed CLI, as `npx @opentide/explorer` would.
      - name: Install the packed package and build
        run: node scripts/check-package.mjs
